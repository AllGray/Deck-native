# The Linux game's tools (nxanalyze, nxlift, nxrt) and SDL3, built from source on Ubuntu 22.04 (glibc 2.35, docs/LINUX-PLAN.md L-D7) so they run on SteamOS.
# Nothing of the game is involved: no dump, no game.so, no shaders.
name: Linux kit

on:
  push:
    branches: ['deck-native', 'mkw-*']
    paths: ['windows/**', 'nxs2.py', '.github/workflows/linux-kit.yml']
  workflow_dispatch:

permissions:
  contents: write   # the rolling pre-release of the tools

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 180
    env:
      LLVM_VERSION: 23.1.4
      SDL3_VERSION: 3.4.18
      VULKAN_SDK_VERSION: 1.4.363.0
      NXW_TOOLCHAINS: /opt/toolchains
      NXW_BUILD_ROOT: /opt/build
    steps:
      - name: System packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl git xz-utils tar python3 python3-pip python3-venv \
            build-essential g++-12 libstdc++-12-dev ninja-build pkg-config binutils libicu70 libtinfo5 libxml2 zlib1g-dev libzstd-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdrm-dev libgbm-dev libegl-dev libgl-dev libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libudev-dev libdbus-1-dev
          python3 -m pip install --quiet 'cmake>=3.28,<4' lz4 fonttools pillow

      - uses: actions/checkout@v4

      - name: Toolchains
        run: |
          mkdir -p "$NXW_TOOLCHAINS"
          cd "$NXW_TOOLCHAINS"
          curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-Linux-X64.tar.xz" -o llvm.tar.xz
          mkdir "llvm-$LLVM_VERSION" && tar -xf llvm.tar.xz --strip-components=1 -C "llvm-$LLVM_VERSION" && rm llvm.tar.xz
          curl -fsSL "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz" -o vk.tar.xz
          mkdir "vulkansdk-$VULKAN_SDK_VERSION" && tar -xf vk.tar.xz --strip-components=1 -C "vulkansdk-$VULKAN_SDK_VERSION" && rm vk.tar.xz
          test -f "vulkansdk-$VULKAN_SDK_VERSION/x86_64/include/vulkan/vulkan.h"
          "llvm-$LLVM_VERSION/bin/clang" --version

      - name: SDL3 from its source release
        run: |
          cd /tmp
          curl -fsSL "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3_VERSION/SDL3-$SDL3_VERSION.tar.gz" | tar -xz
          cmake -S "SDL3-$SDL3_VERSION" -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=OFF -DCMAKE_INSTALL_PREFIX="$NXW_TOOLCHAINS/SDL3-$SDL3_VERSION-linux" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build sdl-build -j 4
          cmake --install sdl-build

      # No nxs2.py setup here: its doctor asks for the tools this job builds. The generator reads nxnative at the patch's commit, on GitHub rather than on a player's computer
      - name: Regenerate the HLE registry from the ported files
        run: |
          git config --global --add safe.directory '*'
          C=$(python3 -I -c "import re;print(re.search(r\"UPSTREAM_COMMIT = '(\w+)'\",open('nxs2.py').read()).group(1))")
          git clone -q --filter=blob:none --no-checkout https://github.com/seedds/nxnative nxnative
          git -C nxnative checkout -q "$C"
          git -C nxnative apply --whitespace=nowarn ../host/nxnative-switch2.patch
          # The vibration graph runs in the SDK (hle_offline.c): the patch's inert hooks must not reach the registry either
          sed -i '/HLE_FORCE("_ZN2nn3hid[^"]*Vibration.*inert/d' nxnative/dm/host/hle_offline.c
          H=windows/src/nxrt
          python3 -I $H/gen/gen_hle.py --nxnative nxnative --port $H/host --port $H/hle --extra $H/tests/hle_sig_test.c --out $H/gen/out
          git status --short -- $H/gen/out | head -30
          echo "::notice::HLE registry: $(grep -c . $H/gen/out/hle_inventory.tsv) lines; $(git diff --stat -- $H/gen/out | tail -1)"

      - name: Build nxrt, nxlift and nxanalyze
        run: |
          set +e
          bash windows/scripts/build.sh -j 4 Release -- -k 0 nxrt nxlift-cli nxanalyze-cli > /tmp/build.log 2>&1
          RC=$?
          tail -5 /tmp/build.log
          if [ $RC -ne 0 ]; then
            grep -E ' error: |ld.lld: error|undefined (symbol|reference)' /tmp/build.log | sed -E 's#^.*/windows/src/##' | sort -u | head -9 | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-400)"; done
          fi
          exit $RC

      - name: Check and collect
        run: |
          B="$NXW_BUILD_ROOT/linux-Release/bin"
          ls -l "$B"
          ldd "$B/nxrt" || true
          # Vulkan's own names only (vk + capital): nxrt's own vk_* and vkw_* symbols cannot interpose anything in the loader
          BAD=$(nm -D --defined-only "$B/nxrt" | awk '$2 ~ /^[BbDd]$/ && $3 ~ /^vk[A-Z]/ {print $3}' | tr '\n' ' ')
          echo "::notice::other vk data symbols: $(nm -D --defined-only "$B/nxrt" | awk '$2 ~ /^[BbDd]$/ && $3 ~ /^vk[^A-Z]/ {print $3}' | tr '\n' ' ' | cut -c1-300)"
          if [ -n "$BAD" ]; then echo "::error::nxrt still exports Vulkan pointers: $(echo "$BAD" | cut -c1-400)"; exit 1; fi
          objdump -T "$B/nxrt" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1
          mkdir -p kit/nxshader
          cp "$B/nxrt" "$B/nxlift" "$B/nxanalyze" kit/
          cp -L "$NXW_TOOLCHAINS/SDL3-$SDL3_VERSION-linux/lib/libSDL3.so.0" kit/
          cp windows/src/nxrt/gen/out/hle_inventory.tsv windows/scripts/play.sh kit/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-kit
          path: kit
          retention-days: 3

      # One rolling pre-release per branch, so the Deck can fetch the tools without a login. Tools only: nothing of the game is in them
      - name: Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="kit-$GITHUB_REF_NAME"; API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          tar -czf linux-kit.tar.gz -C kit .
          sha256sum linux-kit.tar.gz
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          OLD=$(curl -fsS "${AUTH[@]}" "$API/releases?per_page=100" | python3 -I -c "import json,sys;print(next((r['id'] for r in json.load(sys.stdin) if r['tag_name']=='$TAG'),''))")
          if [ -n "$OLD" ]; then curl -fsS -X DELETE "${AUTH[@]}" "$API/releases/$OLD"; fi
          curl -sS -X DELETE "${AUTH[@]}" "$API/git/refs/tags/$TAG" -o /dev/null || true
          BODY=$(python3 -I -c "import json,os;print(json.dumps({'tag_name':'$TAG','target_commitish':os.environ['GITHUB_SHA'],'name':'Deck-native tools, $GITHUB_REF_NAME (test build)','body':'Automatic test build of the tools (nxrt, nxlift, nxanalyze, SDL3). Contains nothing from any game. Not a release.','prerelease':True}))")
          ID=$(curl -fsS -X POST "${AUTH[@]}" "$API/releases" -d "$BODY" | python3 -I -c "import json,sys;print(json.load(sys.stdin)['id'])")
          curl -fsS -X POST "${AUTH[@]}" -H "Content-Type: application/gzip" --data-binary @linux-kit.tar.gz "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=linux-kit.tar.gz" -o /dev/null
          echo "::notice::published $TAG"
